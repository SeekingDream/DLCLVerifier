# Input domains. X is always a set of finite floating-point values unless stated.
schema_version: 1
status: unimplemented  # definitions are final enough to review; no loader semantics beyond validation
domains:
  - {id: D0_point, kind: point, source: test-set samples, purpose: "scheduling and FP-env sensitivity with no input abstraction"}
  - {id: D1_local_1_255, kind: linf_ball, radius: 1/255, space: input pre-normalization, clip: [0, 1]}
  - {id: D2_local_8_255, kind: linf_ball, radius: 8/255, space: input pre-normalization, clip: [0, 1]}
  - {id: D3_data_hull, kind: box, source: per-feature min/max over the training set, note: "not a proof about unseen data outside the hull"}
  - {id: D4_global_valid, kind: box, source: documented valid range, note: "expected to be vacuous at model scale"}
  - {id: D5_token_ids, kind: finite_integer_vector, source: vocabulary range and fixed sequence length, note: "sequences must be enumerated or embedded into a box after the embedding lookup"}
  - {id: D6_embedding_ball, kind: linf_ball, radius: "declared per model, relative to embedding scale", space: token embeddings, note: "LLM and transformer domain; covers perturbed embeddings, not all token sequences"}
subnormal_inputs: included   # one sensitivity run excludes them
sampling_is_not_verification: true
