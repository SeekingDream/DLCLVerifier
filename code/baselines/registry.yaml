# guarantee values:
#   formal             mathematically sound bound or proof under stated assumptions
#   formal_first_order rigorous first-order analysis; higher-order terms need separate treatment
#   formal_real_semantics sound for real-valued arithmetic, NOT for floating-point execution
#   formal_equality    proves equivalence or refinement, gives no epsilon bound
#   formal_bounded     proof only up to stated shape, unrolling or other bounds
#   probabilistic      holds with stated probability under stated model assumptions
#   empirical          evidence from executions only
# integration: unimplemented for all entries. "pilot" means a local trial only.
